name: newsarr

services:
  newsarr:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PUID: ${PUID:-1000}
        PGID: ${PGID:-1000}
    image: newsarr:latest
    container_name: newsarr
    init: true
    restart: unless-stopped
    ports:
      - "${NEWSARR_HTTP_PORT:-7878}:7878"
    environment:
      NEWSARR_DATA_DIR: /data
    volumes:
      - newsarr-data:/data
      # Mount a library/download directory here if you want imports outside the
      # named volume. Use the same path in qBittorrent and set the library root
      # in Newsarr's Settings page.
      # - /path/to/media:/media
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7878/api/v1/health', timeout=4)"
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  newsarr-data:
